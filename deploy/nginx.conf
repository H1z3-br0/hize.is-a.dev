map $http_user_agent $is_cli {
    default                              0;
    "~*^(curl|wget|httpie|python-requests|libwww-perl|fetch)/" 1;
}

map $http_accept_language $cli_card {
    default        /card.txt;
    "~*^\s*en"     /en/card.txt;
}

server {
    listen 80;
    listen [::]:80;
    server_name ПОСТАВЬТЕ_ДОМЕН www.ПОСТАВЬТЕ_ДОМЕН;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ПОСТАВЬТЕ_ДОМЕН www.ПОСТАВЬТЕ_ДОМЕН;

    root /var/www/imam;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Lattice "ctrl-k, then ./secret" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 512;

    location = / {
        if ($is_cli) { rewrite ^ $cli_card last; }
        try_files /index.html =404;
    }

    location = /en/ {
        if ($is_cli) { rewrite ^ /en/card.txt last; }
        try_files /en/index.html =404;
    }

    location ~* ^/(a|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
